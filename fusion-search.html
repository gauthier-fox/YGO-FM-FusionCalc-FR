<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Yu-Gi-Oh! Forbiden Memories fusion list" />
        <meta name="keywords" content="Yu-Gi-Oh!, YuGiOh, Forbiden Memories, playstation, Fusion" />
        <meta name="robots" content="index, follow" />
        <title>Yu-Gi-Oh! Forbiden Memories Fusion Calculator</title>
        <link rel="icon" type="image/x-icon" href="public/images/yugioh.ico" />
        <link rel="preconnect" href="https://fonts.gstatic.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap"
            rel="stylesheet"
        />
        <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
        <link rel="stylesheet" type="text/css" href="public/styles/normalize.css" />
        <link rel="stylesheet" type="text/css" href="public/styles/bootstrap.min.css" />
        <link rel="stylesheet" type="text/css" href="public/styles/home.css" />
        <link rel="stylesheet" type="text/css" href="public/styles/awesomplete.css" />
		
        <script>
            const langue = navigator.language.toLowerCase();
            const langueActive = langue.startsWith("fr") ? "fr" : "en";
            window.langueActive = langueActive;
        </script>
        <script type="text/javascript" src="public/javascripts/i18n.js"></script>
    </head>

    <body class="bg-dark d-flex flex-column min-vh-100 polymerization">
        <header class="navbar navbar-expand-lg navbar-light bg-light flex-column flex-md-row">
            <a class="navbar-brand text-truncate" href="index.html">
                <img
                    class="img-fluid ml-4"
                    id="logo"
                    src="./public/images/logo.png"
                    alt="Yu-Gi-Oh! Forbiden Memories Logo"
                />
            </a>
            <button
                class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon d-md-none p-0 mx-2 collapsed"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="fusion-search.html" data-i18n="nav.search">Fusion Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="fusion-calculator.html" data-i18n="nav.calc">Fusion Calculator</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="javascript:void(0)" data-target="#imageModal" data-toggle="modal" data-i18n="nav.guardian">
                            Guardian Star
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="about.html" data-i18n="nav.about">About</a>
                    </li>
                    <li class="nav-item">
                        <a
                            class="btn btn-bd btn-thread"
                            href="http://forums.somethingawful.com/showthread.php?threadid=3783156"
                            rel="noopener noreferrer"
                            target="_blank"
                            data-i18n="nav.thread"
                            >Thread</a
                        >
                    </li>
                </ul>
            </div>

            <div class="modal fade" id="imageModal" tabindex="-1" role="dialog" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
                    <div class="modal-content text-center">

                        <div class="modal-body">
                            <div><img id="guardian-star-image"  class="img-fluid"  alt="Guardian Star strengths & weaknesses" ></div>
                            <script>
                                document.getElementById("guardian-star-image").src =
                                    `public/images/guardian-star-${langueActive}.png`;
                            </script>
                            <div class="mt-3"><span data-i18n="modal.credit"></span><a href="https://yugioh.fandom.com/wiki/Guardian_Star" target="_blank" rel="noopener noreferrer">Yu-Gi-Oh! Fandom</a>.</div>
                            
                            <div class="mt-2"><a href="javascript:void(0)" class="btn btn-secondary btn-sm mt-3" data-dismiss="modal" data-i18n="modal.close"></a></div>

                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main class="container">
            <section class="row mt-3 rounded-lg bg-light">
                <div class="col">
                    <h2 class="text-main my-5 text-center" data-i18n="search.title">SEARCH</h2>
                    <div class="row my-3">
                        <div class="col-sm-8 offset-sm-1 col-md-5 offset-md-1 d-flex flex-column">
                            <p data-i18n="search.typeCard">Type the card name</p>
                            <input class="w-100" type="text" id="cardname" data-i18n="search.cardPlaceholder" />

                            <div class="btn-group my-5" role="group">
                                <button type="button" class="btn btn-outline-success" id="search-name-btn" data-i18n="search.searchByName">
                                    Search by Name
                                </button>

                                <button
                                    type="button"
                                    class="btn btn-outline-success"
                                    id="search-results-btn"
                                    data-i18n="search.searchByResult"
                                >
                                    Search by Result
                                </button>

                                <button type="button" class="btn btn-danger" id="reset-btn" data-i18n="search.reset">
                                    Reset All
                                </button>
                            </div>
                        </div>
                        <div
                            class="col-sm-10 offset-sm-1 col-md-4 offset-md-1 d-flex justify-content-center"
                        >
                            <div id="outputcard"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="row rounded-lg my-4 bg-light">
                <div class="col text-center my-4">
                    <h3 class="text-main my-4" data-i18n="results.title">RESULTS</h3>
                    <span id="search-msg"></span>

                    <div class="row">
                        <div class="col-sm d-flex justify-content-center">
                            <div id="output-area-left"></div>
                        </div>
                        <div class="col-sm d-flex justify-content-center">
                            <div id="output-area-right"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="container-fluid mt-auto">
            <div class="row footer-bottom">
                <div class="col text-center my-3">
                    <a
                        class="d-inline m-0 p-0 text-decoration-none"
                        href="index.html"
                        rel="noopener noreferrer"
                    >
                        <img
                            loading="lazy"
                            class="millennium-pendant"
                            src="public/images/item.png"
                            alt="millennium-pendant"
                        />
                    </a>
                    <p class="my-3 text-white d-inline">
                        Yu-Gi-Oh! Forbiden Memories Fusion Calculator © 2026
                    </p>
                    <a
                        class="d-inline m-0 p-0"
                        href="https://github.com/Solumin/YGO-FM-FusionCalc"
                        rel="noopener noreferrer"
                        target="_blank"
                    >
                        <img class="gh-logo" src="https://simpleicons.org/icons/github.svg" alt="GitHub" />
                    </a>
                </div>
            </div>
        </footer>
        <script type="text/javascript" src="public/javascripts/awesomplete.min.js"></script>
        <script type="text/javascript" src="public/javascripts/jquery-3.7.1.min.js"></script>
        <script type="text/javascript" src="public/javascripts/bootstrap.bundle.min.js"></script>
        <script type="text/javascript" src="public/javascripts/taffy.js"></script>
		<script>
			const fileCards = "data/cards_"+langueActive+".js"
			const fileTypesStars = "data/types_and_stars_"+langueActive+".js"

			document.write(
				'<script type="text/javascript" src="' + fileCards + '"><\/script><script type="text/javascript" src="' + fileTypesStars + '"><\/script>'
			);
		</script>
        <script type="text/javascript" src="data/fusions.js"></script>
        <script type="text/javascript" src="data/equips.js"></script>
        <script type="text/javascript" src="data/results.js"></script>
        <script type="text/javascript" src="public/javascripts/fusionSearch.js"></script>
    </body>
</html>
